<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TeachAide AI | AI Lesson Notes & Teaching Assistant for Nigerian Educators</title>
  <meta name="description"
    content="TeachAide AI helps Nigerian teachers generate structured, curriculum-aligned lesson notes, comprehension passages, vocabulary development, assessments, and timetables in seconds." />

  <!-- Open Graph / Facebook / WhatsApp -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="TeachAide AI – Smarter Lesson Planning for Teachers" />
  <meta property="og:description"
    content="An AI-powered teaching assistant built for Nigerian educators. Generate lesson notes, comprehension passages, vocabulary development, assessments, and timetables instantly." />
  <meta property="og:url" content="https://www.teachaide.ng" />
  <meta property="og:image" content="https://www.teachaide.ng/og-image.png" />
  <meta property="og:site_name" content="TeachAide AI" />
  <meta property="og:locale" content="en_NG" />

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="TeachAide AI – AI Assistant for Teachers" />
  <meta name="twitter:description"
    content="Generate curriculum-aligned lesson notes, comprehension passages, vocabulary development, and assessments in seconds with TeachAide AI." />
  <meta name="twitter:image" content="https://www.teachaide.ng/og-image.png" />
  <meta name="twitter:site" content="@TeachAideAI" />

  <script>
    // Apply saved theme early to avoid flash
    try {
      const settingsStr = localStorage.getItem('teachaide_settings');
      if (settingsStr) {
        const settings = JSON.parse(settingsStr);
        if (settings.theme === 'dark') {
          // Add the 'dark' class for Tailwind's class-based dark mode
          try { document.documentElement.classList.add('dark'); } catch (e) { }

          // Replace light classes on body when dark is set
          document.addEventListener('DOMContentLoaded', () => {
            try {
              document.body.classList.remove('bg-slate-50', 'text-slate-900');
              document.body.classList.add('bg-slate-900', 'text-slate-100');
            } catch (e) { }
          });

          // Also try immediate in case DOMContentLoaded already fired
          try {
            document.body.classList.remove('bg-slate-50', 'text-slate-900');
            document.body.classList.add('bg-slate-900', 'text-slate-100');
          } catch (e) { }
        } else {
          // Ensure dark class is removed for light theme
          try { document.documentElement.classList.remove('dark'); } catch (e) { }
        }
      }
    } catch (e) {
      // ignore parsing errors
    }
  </script>

</head>

<body class="bg-slate-50 text-slate-900">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
