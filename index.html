<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TeachAide AI - Lesson Notes in Seconds</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#f0fdf4',
                100: '#dcfce7',
                200: '#bbf7d0',
                300: '#86efac',
                400: '#4ade80',
                500: '#22c55e',
                600: '#16a34a',
                700: '#15803d',
                800: '#166534',
                900: '#14532d',
              }
            }
          }
        }
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
      body {
        font-family: 'Inter', sans-serif;
      }
      
      /* Fix for Chrome/Edge Autofill background color */
      input:-webkit-autofill,
      input:-webkit-autofill:hover, 
      input:-webkit-autofill:focus, 
      input:-webkit-autofill:active {
        -webkit-box-shadow: 0 0 0 30px white inset !important;
        -webkit-text-fill-color: #0f172a !important; /* slate-900 */
        transition: background-color 5000s ease-in-out 0s;
      }

      @media print {
        body {
          background-color: white;
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }
        @page {
          margin: 0.5cm;
          size: auto;
        }
      }
      /* Smooth transitions for theme changes */
      html, body, .bg-white, .bg-slate-50, .bg-slate-900 {
        transition: background-color 220ms ease, color 220ms ease;
      }

      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }
      .animate-float {
        animation: float 3s ease-in-out infinite;
      }

      @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }
      .animate-shimmer {
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
        background-size: 200% 100%;
        animation: shimmer 2s infinite;
      }
    </style>
    <script>
      // Apply saved theme early to avoid flash
      try {
        const settingsStr = localStorage.getItem('teachaide_settings');
        if (settingsStr) {
          const settings = JSON.parse(settingsStr);
          if (settings.theme === 'dark') {
            // Add the 'dark' class for Tailwind's class-based dark mode
            try { document.documentElement.classList.add('dark'); } catch (e) {}

            // Replace light classes on body when dark is set
            document.addEventListener('DOMContentLoaded', () => {
              try {
                document.body.classList.remove('bg-slate-50', 'text-slate-900');
                document.body.classList.add('bg-slate-900', 'text-slate-100');
              } catch (e) {}
            });

            // Also try immediate in case DOMContentLoaded already fired
            try {
              document.body.classList.remove('bg-slate-50', 'text-slate-900');
              document.body.classList.add('bg-slate-900', 'text-slate-100');
            } catch (e) {}
          } else {
            // Ensure dark class is removed for light theme
            try { document.documentElement.classList.remove('dark'); } catch (e) {}
          }
        }
      } catch (e) {
        // ignore parsing errors
      }
    </script>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "react-router-dom": "https://esm.sh/react-router-dom@6.22.3?deps=react@18.3.1,react-dom@18.3.1",
    "@google/genai": "https://esm.sh/@google/genai",
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-slate-50 text-slate-900">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
